[project]
name = "cajuina-api"
version = "0.1.0"
description = "API para Cajuína Seguros"
requires-python = ">=3.11"
dependencies = [
    "django>=4.2,<5.0",
    "djangorestframework",
    "djangorestframework-simplejwt",
    "psycopg2-binary",
    "django-cors-headers",
    "gunicorn",
    "pillow",
    # Cliente HTTP das integrações com seguradoras (apps/emissoes).
    "httpx",
    "requests",
]

[dependency-groups]
dev = [
    "pytest",
    # Pin de minor: pytest-django 4.13 usa `_pre_setup_ran_eagerly`, atributo que
    # so existe no Django 5.x, e nao declara esse limite no metadata dele. Em cima
    # do Django 4.2 daqui ele resolve normal e quebra em runtime (281 erros).
    "pytest-django>=4.12,<4.13",
    # Pin de minor: o conjunto de regras default do ruff muda entre releases
    # (0.16 ativou RUF012/FURB/DTZ e quebrou o CI sem mudanca de codigo).
    "ruff>=0.16,<0.17",
]

[tool.ruff.lint]
# `select` explicito para o lint nao depender do default da versao instalada.
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
# E501 (comprimento de linha) fica fora: e formatacao, nao correcao.

[tool.ruff.lint.per-file-ignores]
# Settings do Django usam idiomas que o ruff sinaliza por padrão:
# `from .base import *` (F403/F405) e imports após blocos de config (E402).
"config/settings/*.py" = ["F403", "F405", "E402"]
